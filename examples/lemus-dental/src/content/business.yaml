about: |-
  Lemus Dental is a team of experienced, dedicated dental professionals offering the best dental care for the whole family. We use advanced dental technology to ensure the satisfaction of every patient. Our goal is to determine the treatment you need or want and deliver it efficiently, with clinical excellence and courtesy.

  Our practice mostly uses high-quality, mercury-free composite restorations and low-radiation digital X-rays, so you stay comfortable and spend as little time in the dental chair as possible. We offer all basic dental services, including high-quality crowns and bridges, plus specialized services such as oral surgery, endodontics, periodontics and implants.

  Adults: we are committed to delivering qualified care for all adults, including basic treatments, implants and cosmetic dentistry.

  Seniors: elderly patients are one of our priorities. We are specially trained in the dental needs of older adults, restoring comfort when chewing and a beautiful smile.

  Children: we offer in-office restorative services for young children, home-care instructions, guidance on keeping teeth decay-free, when children should see the dentist, when baby and permanent teeth usually come in, and protective sealants.

  Affordable dental care: ask us about accepted insurance plans and payment options, including payment plans.

  Emergencies: we are available 24/7 for dental emergencies.
