- id: isel-lemus
  name: Dr. Isel Lemus
  role: Dentist, DMD
  bio: >-
    Dr. Lemus has more than 25 years of experience as a dentist. She earned her
    Doctor of Dental Medicine in 1992 and qualified as a periodontologist in
    1995 in Villa Clara, Cuba. In 2013 she completed Advanced Education in
    General Dentistry at Nova Southeastern University. She is trained in caring
    for patients with special needs.
  photo:
    src: https://static.wixstatic.com/media/3f4fbc_4f10c2190f9d4a2a8be34d133b45785a~mv2.jpg
    alt: Dr. Isel Lemus
- id: odisa-garcia
  name: Odisa Garcia
  role: Hygienist
  bio: >-
    Odisa brings more than 20 years of experience as a periodontist. Born in
    Santa Clara, Cuba, she studied and practiced there for 20 years before
    moving to Miami, where she graduated as a dental hygienist.
  photo:
    src: https://static.wixstatic.com/media/3f4fbc_9759d8dd7ccb46c88b1364f0919dc9ae~mv2.jpg
    alt: Odisa Garcia
- id: diana-castellanos
  name: Diana Castellanos
  role: Dental Assistant
  bio: >-
    With over 2 years of experience, Diana works efficiently and loves making
    patients smile. Born in Cuba and living in Miami for several years, she
    enjoys family life and spends her free time with her daughter and husband.
  photo:
    src: https://static.wixstatic.com/media/3f4fbc_f369f1818bdd41819bdcf4043fb72298~mv2.jpg
