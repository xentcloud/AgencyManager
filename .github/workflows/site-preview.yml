# Reusable: build a PR and upload it as a Cloudflare Worker preview version.
# Records a GitHub "preview" deployment; the portal receives deployment_status webhooks.
name: site-preview

on:
  workflow_call:
    inputs:
      runner:
        description: 'JSON runs-on value, e.g. ["self-hosted","Linux","dokploy-linux"]'
        type: string
        required: false
        default: '"ubuntu-latest"'
    secrets:
      # Optional at startup so a missing token can't invalidate the caller's other jobs; checked below.
      CLOUDFLARE_API_TOKEN: { required: false }
      CLOUDFLARE_ACCOUNT_ID: { required: false }

jobs:
  preview:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: xentcloud/AgencyManager/.github/actions/setup-tools@v1
      - name: Require Cloudflare credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set"; exit 1
          fi
      - uses: actions/checkout@v7
      # A repo freshly generated from the template still has the template's Worker name until the
      # portal's setup commit lands; never deploy that (it would create a stray "site-template" Worker).
      - id: guard
        run: |
          if grep -q '"name": *"site-template"' wrangler.jsonc; then
            echo "::notice::Unpersonalized template commit; skipping deploy"; echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: xentcloud/AgencyManager/.github/actions/setup-site@v1
        if: steps.guard.outputs.skip != 'true'
      - run: pnpm build
        if: steps.guard.outputs.skip != 'true'
      - id: upload
        if: steps.guard.outputs.skip != 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          # Pasted secrets sometimes carry whitespace/newlines; Cloudflare rejects those headers.
          # Accept a pasted "Authorization: Bearer cfat_..." line too: extract the token itself.
          raw="$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          tok="$(printf %s "$raw" | grep -oE 'cf[a-z]t_[A-Za-z0-9]+' | head -1 || true)"
          CLOUDFLARE_API_TOKEN="${tok:-$raw}"; export CLOUDFLARE_API_TOKEN
          [ -n "$tok" ] || echo "::warning::CLOUDFLARE_API_TOKEN (length ${#raw}, starts '${raw:0:4}…') isn't a cfat_/cfut_ token; using it as-is"
          out=$(pnpm exec wrangler versions upload --preview-alias "pr-${{ github.event.pull_request.number }}" 2>&1 | tee /dev/stderr)
          url=$(echo "$out" | grep -oE 'https://pr-[^ ]+\.workers\.dev' | head -1)
          [ -n "$url" ] || url=$(echo "$out" | grep -oE 'https://[^ ]+\.workers\.dev' | tail -1)
          [ -n "$url" ] || { echo "::error::No preview URL in wrangler output"; exit 1; }
          echo "url=$url" >> $GITHUB_OUTPUT
      - name: Record deployment and comment
        if: steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.upload.outputs.url }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          # ref = PR branch (agent/issue-<n>) so the portal can map this deployment to its change request.
          id=$(echo '{"ref":"'$HEAD_REF'","environment":"preview","auto_merge":false,"required_contexts":[],"transient_environment":true}' \
            | gh api repos/$GITHUB_REPOSITORY/deployments --input - --jq .id)
          gh api repos/$GITHUB_REPOSITORY/deployments/$id/statuses -f state=success -f environment_url="$URL" >/dev/null
          gh pr comment "$PR" --body "Preview ready: $URL" --edit-last 2>/dev/null || gh pr comment "$PR" --body "Preview ready: $URL"
