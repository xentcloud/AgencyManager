# Reusable: deploy main to production. Merge is the privilege boundary.
name: site-deploy

on:
  workflow_call:
    secrets:
      # Optional at startup so a missing token can't invalidate the caller's other jobs; checked below.
      CLOUDFLARE_API_TOKEN: { required: false }
      CLOUDFLARE_ACCOUNT_ID: { required: false }

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Require Cloudflare credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set"; exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          out=$(pnpm exec wrangler deploy 2>&1 | tee /dev/stderr)
          echo "url=$(echo "$out" | grep -oE 'https://[^ ]+' | head -1)" >> $GITHUB_OUTPUT
      - name: Record production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          id=$(echo '{"ref":"'$GITHUB_SHA'","environment":"production","auto_merge":false,"required_contexts":[],"production_environment":true}' \
            | gh api repos/$GITHUB_REPOSITORY/deployments --input - --jq .id)
          gh api repos/$GITHUB_REPOSITORY/deployments/$id/statuses -f state=success -f environment_url="$URL" >/dev/null
