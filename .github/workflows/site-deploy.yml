# Reusable: deploy main to production. Merge is the privilege boundary.
name: site-deploy

on:
  workflow_call:
    inputs:
      runner:
        description: 'JSON runs-on value, e.g. ["self-hosted","Linux","dokploy-linux"]'
        type: string
        required: false
        default: '"ubuntu-latest"'
    secrets:
      # Optional at startup so a missing token can't invalidate the caller's other jobs; checked below.
      CLOUDFLARE_API_TOKEN: { required: false }
      CLOUDFLARE_ACCOUNT_ID: { required: false }

concurrency:
  group: deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: xentcloud/AgencyManager/.github/actions/setup-tools@v1
      - name: Require Cloudflare credentials
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$TOKEN" ] || [ -z "$ACCOUNT" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set"; exit 1
          fi
      - uses: actions/checkout@v7
      - uses: xentcloud/AgencyManager/.github/actions/setup-site@v1
      - run: pnpm build
      - id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          # Pasted secrets sometimes carry whitespace/newlines; Cloudflare rejects those headers.
          # Accept a pasted "Authorization: Bearer cfat_..." line too: extract the token itself.
          raw="$(printf %s "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')"
          tok="$(printf %s "$raw" | grep -oE 'cf[a-z]t_[A-Za-z0-9]+' | head -1 || true)"
          CLOUDFLARE_API_TOKEN="${tok:-$raw}"; export CLOUDFLARE_API_TOKEN
          [ -n "$tok" ] || echo "::warning::CLOUDFLARE_API_TOKEN (length ${#raw}, starts '${raw:0:4}…') isn't a cfat_/cfut_ token; using it as-is"
          out=$(pnpm exec wrangler deploy 2>&1 | tee /dev/stderr)
          url=$(echo "$out" | grep -oE 'https://[^ ]+\.(workers\.dev|[a-z]{2,})' | grep -v cloudflare | head -1)
          [ -n "$url" ] || { echo "::error::No URL in wrangler output"; exit 1; }
          echo "url=$url" >> $GITHUB_OUTPUT
      - name: Record production deployment
        env:
          GH_TOKEN: ${{ github.token }}
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          id=$(echo '{"ref":"'$GITHUB_SHA'","environment":"production","auto_merge":false,"required_contexts":[],"production_environment":true}' \
            | gh api repos/$GITHUB_REPOSITORY/deployments --input - --jq .id)
          gh api repos/$GITHUB_REPOSITORY/deployments/$id/statuses -f state=success -f environment_url="$URL" >/dev/null
