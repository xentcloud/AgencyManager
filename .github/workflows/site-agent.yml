# Reusable: run Claude Code or Codex on a change-request issue in a client site repo.
# The agent only edits files. This workflow validates, commits and opens/updates the PR
# using the agency GitHub App token, so `pull_request` workflows (preview deploy) fire.
# The App must NOT have `workflows: write`, so agents can't change CI.
name: site-agent

on:
  workflow_call:
    inputs:
      runner:
        description: 'JSON runs-on value, e.g. ["self-hosted","Linux","dokploy-linux"]'
        type: string
        required: false
        default: '"ubuntu-latest"'
      issue_number: { type: number, required: true }
      feedback: { type: string, required: false, default: "" }
    secrets:
      AGENCY_APP_ID: { required: true }
      AGENCY_APP_PRIVATE_KEY: { required: true }
      ANTHROPIC_API_KEY: { required: false }
      OPENAI_API_KEY: { required: false }

concurrency:
  group: agent-${{ github.repository }}-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  agent:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: xentcloud/AgencyManager/.github/actions/setup-tools@v1
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENCY_APP_CLIENT_ID }}
          private-key: ${{ secrets.AGENCY_APP_PRIVATE_KEY }}

      - id: issue
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          N: ${{ inputs.issue_number }}
        run: |
          gh api repos/$GITHUB_REPOSITORY/issues/$N > "$RUNNER_TEMP/issue.json"
          labels=$(jq -r '[.labels[].name] | join(",")' "$RUNNER_TEMP/issue.json")
          if [[ ",$labels," == *",agent:codex,"* ]]; then echo "agent=codex" >> $GITHUB_OUTPUT; else echo "agent=claude" >> $GITHUB_OUTPUT; fi
          if [[ ",$labels," == *",type:migrate,"* ]]; then
            echo "playbook=migration" >> $GITHUB_OUTPUT
            echo "tools=Read,Edit,Write,Glob,Grep,WebFetch,Bash(pnpm validate),Bash(pnpm build)" >> $GITHUB_OUTPUT
          else
            echo "playbook=change-request" >> $GITHUB_OUTPUT
            echo "tools=Read,Edit,Write,Glob,Grep,Bash(pnpm validate),Bash(pnpm build)" >> $GITHUB_OUTPUT
          fi
          echo "branch=agent/issue-$N" >> $GITHUB_OUTPUT

      # Don't persist the App token in .git/config: `pnpm build` runs site code (astro config, overrides)
      # that the agent may have edited. Only the push/PR step gets the token.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use existing agent branch (revision) or create it
        env:
          BRANCH: ${{ steps.issue.outputs.branch }}
          TOKEN: ${{ steps.app.outputs.token }}
        run: |
          git remote set-url origin "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null; then
            git fetch origin "$BRANCH" && git checkout "$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi
          git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"

      - uses: xentcloud/AgencyManager/.github/actions/setup-site@v1

      - name: Build prompt
        id: prompt
        env:
          FEEDBACK: ${{ inputs.feedback }}
        run: |
          {
            echo "First read AGENTS.md (this site's memory: customer specs, brand, don't-change list), then follow node_modules/@agency-manager/astro-core/agent/AGENTS.md and node_modules/@agency-manager/astro-core/agent/playbooks/${{ steps.issue.outputs.playbook }}.md."
            echo "When done, write a 1-3 sentence plain-English summary for the customer to AGENT_SUMMARY.md in the repo root."
            echo
            echo "## Request (issue #${{ inputs.issue_number }})"
            jq -r '"### " + .title + "\n\n" + (.body // "")' "$RUNNER_TEMP/issue.json"
            if [ -n "$FEEDBACK" ]; then
              echo; echo "## Customer feedback on the current preview (apply this now)"; echo "$FEEDBACK"
            fi
          } > "$RUNNER_TEMP/agent-prompt.md"
          delim="EOF_$(openssl rand -hex 8)"
          { echo "text<<$delim"; cat "$RUNNER_TEMP/agent-prompt.md"; echo "$delim"; } >> $GITHUB_OUTPUT

      - name: Run Claude Code
        if: steps.issue.outputs.agent == 'claude'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Read-only job token: the agent step never holds the App token.
          github_token: ${{ github.token }}
          prompt: ${{ steps.prompt.outputs.text }}
          claude_args: >-
            --allowedTools "${{ steps.issue.outputs.tools }}"
            --disallowedTools "mcp__github_file_ops__commit_files,mcp__github_file_ops__delete_files"

      - name: Run Codex
        if: steps.issue.outputs.agent == 'codex'
        uses: openai/codex-action@v1
        with:
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}
          prompt-file: ${{ runner.temp }}/agent-prompt.md
          output-file: ${{ runner.temp }}/agent-summary.md
          sandbox: workspace-write

      - name: Agent asked a question?
        id: question
        run: |
          # Keep agent notes out of the commit.
          if [ -f AGENT_SUMMARY.md ]; then mv AGENT_SUMMARY.md "$RUNNER_TEMP/agent-summary.md"; fi
          if [ -f AGENT_QUESTION.md ]; then echo "asked=true" >> $GITHUB_OUTPUT; fi

      - name: Validate and build
        if: steps.question.outputs.asked != 'true'
        run: pnpm validate && pnpm build

      - name: Guard changed paths
        if: steps.question.outputs.asked != 'true'
        run: |
          changed=$(git status --porcelain | awk '{print $2}')
          # AGENTS.md is the site's memory and agents may update it; CLAUDE.md must stay a symlink to it.
          if echo "$changed" | grep -E '^(\.github/|wrangler\.jsonc|package\.json|pnpm-lock\.yaml|astro\.config\.mjs|tsconfig\.json|CLAUDE\.md)'; then
            echo "::error::Agent modified protected files"; exit 1
          fi
          # Anything outside content/images/site config is a code change: staff must review before merge.
          if echo "$changed" | grep -vE '^(src/content/|public/images/|site\.config\.ts$|AGENTS\.md$)' | grep -q .; then
            echo "TIER=code" >> $GITHUB_ENV
          else
            echo "TIER=content" >> $GITHUB_ENV
          fi

      - name: Commit, push and open/update PR
        if: steps.question.outputs.asked != 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ steps.issue.outputs.branch }}
          N: ${{ inputs.issue_number }}
        run: |
          git config user.name "agency-bot"
          git config user.email "agency-bot@users.noreply.github.com"
          git add -A  # .gitignore excludes dist/ and node_modules/
          if git diff --cached --quiet; then
            gh issue comment "$N" --body "The agent made no changes. Marking for human review."
            gh issue edit "$N" --add-label needs-human
            exit 0
          fi
          title=$(jq -r .title "$RUNNER_TEMP/issue.json")
          # Site memory: one change-log line per request (AGENTS.md ends with the Change log section).
          if [ -f AGENTS.md ] && ! grep -q "· #$N ·" AGENTS.md; then
            printf -- '- %s · #%s · %s\n' "$(date -u +%F)" "$N" "$title" >> AGENTS.md
            git add AGENTS.md
          fi
          git commit -m "$title (#$N)"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$BRANCH"
          summary=$(cat "$RUNNER_TEMP/agent-summary.md" 2>/dev/null || echo "Automated change for #$N.")
          if pr=$(gh pr view "$BRANCH" --json number -q .number 2>/dev/null); then
            gh pr comment "$pr" --body "Updated after feedback."$'\n\n'"$summary"
          else
            gh pr create --head "$BRANCH" --title "$(jq -r .title "$RUNNER_TEMP/issue.json")" \
              --body "$summary"$'\n\n'"Closes #$N" --label "agent:${{ steps.issue.outputs.agent }}" --label "tier:$TIER"
          fi

      - name: Post question and hand off to a human
        if: steps.question.outputs.asked == 'true'
        env: { GH_TOKEN: "${{ steps.app.outputs.token }}", N: "${{ inputs.issue_number }}" }
        run: |
          gh issue comment "$N" --body-file AGENT_QUESTION.md
          rm -f AGENT_QUESTION.md
          gh issue edit "$N" --add-label needs-info

      - name: Flag failure
        if: failure()
        env: { GH_TOKEN: "${{ steps.app.outputs.token }}", N: "${{ inputs.issue_number }}" }
        run: |
          gh issue comment "$N" --body "The agent run failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          gh issue edit "$N" --add-label needs-human
