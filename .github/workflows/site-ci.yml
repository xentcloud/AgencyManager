# Reusable: validate content and build (used on PRs, including base-version bumps).
name: site-ci

on:
  workflow_call:
    inputs:
      runner:
        description: 'JSON runs-on value, e.g. ["self-hosted","Linux","dokploy-linux"]'
        type: string
        required: false
        default: '"ubuntu-latest"'

jobs:
  build:
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 10
    permissions: { contents: read }
    steps:
      - uses: actions/checkout@v7
      - uses: xentcloud/AgencyManager/.github/actions/setup-site@v1
      - run: pnpm validate
      - run: pnpm build
