name: setup-site
description: Node + pnpm (pure-JS build, works on minimal self-hosted images) + frozen install for a client site.
inputs:
  node-version: { default: "22", description: Node.js version }
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with: { node-version: "${{ inputs.node-version }}" }
    - shell: bash
      run: |
        set -euo pipefail
        # Version from package.json "packageManager" (e.g. pnpm@10.33.0), else latest 10.x.
        v=$(node -p "((require('./package.json').packageManager||'').match(/^pnpm@([^+]+)/)||[])[1]||'10'")
        npm install -g "pnpm@$v" --no-audit --no-fund >/dev/null
        pnpm --version
        pnpm install --frozen-lockfile
